<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守护极地 | 最后的净土</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">ANTARCTICA</div>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#mission">我们的使命</a></li>
            <li><a href="#action">加入行动</a></li>
        </ul>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>保护，不留痕迹。</h1>
            <p>南极不仅是冰川，更是地球生态的最后一道防线。</p>
            <a href="#mission" class="btn">探索更多</a>
        </div>
    </section>

    <section id="mission" class="mission">
        <div class="container">
            <h2 class="section-title">全球气候的平衡器</h2>
            <div class="grid">
                <div class="card">
                    <h3>01. 冰川消融</h3>
                    <p>过去30年，南极冰盖的融化速度增加了三倍，海平面上升威胁着全球沿海城市。</p>
                </div>
                <div class="card">
                    <h3>02. 物种多样性</h3>
                    <p>从企鹅到磷虾，极地生物正面临栖息地丧失的生存危机。</p>
                </div>
                <div class="card">
                    <h3>03. 零碳倡议</h3>
                    <p>通过减少碳排放和推动极地立法，我们可以为子孙后代留住这片冰蓝。</p>
                </div>
            </div>
        </div>
    </section>

    <section id="action" class="action">
        <div class="action-box">
            <h2>每一份关注都是一种力量</h2>
            <p>订阅我们的动态，了解如何从日常生活开始参与南极保护。</p>
            <form class="subscribe-form">
                <input type="email" placeholder="您的邮箱地址">
                <button type="submit">立即行动</button>
            </form>
        </div>
    </section>

    <footer>
